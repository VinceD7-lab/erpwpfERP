name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    # WPF (net10.0-windows) : compilation et tests sur Windows.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: SQL Server LocalDB (tests d'intégration)
        shell: pwsh
        run: |
          if (-not (Get-Command sqllocaldb -ErrorAction SilentlyContinue)) {
            choco install sqllocaldb --no-progress -y
            $env:Path += ";C:\Program Files\Microsoft SQL Server\150\Tools\Binn"
            "C:\Program Files\Microsoft SQL Server\150\Tools\Binn" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          sqllocaldb info
          sqllocaldb start MSSQLLocalDB

      - name: Restauration
        run: dotnet restore erpWpf.sln

      - name: Compilation
        run: dotnet build erpWpf.sln --no-restore -c Release

      - name: Format
        run: dotnet format erpWpf.sln --no-restore --verify-no-changes

      - name: Tests
        run: dotnet test erpWpf.sln --no-build -c Release --logger trx --results-directory resultats-tests

      - name: Résultats des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: resultats-tests
